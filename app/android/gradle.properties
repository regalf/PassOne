# The Gradle daemon is kept alive between builds to make them faster, but by
# default it reserves -Xmx8G (a quarter of the system memory) and stays up
# for 3 hours after the last build. 4G is enough here and the daemon is
# reclaimed after 30 idle minutes, so a build does not leave the machine
# without memory.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.daemon.idletimeout=1800000

# The Kotlin compile daemon is a separate process with its own heap.
kotlin.daemon.jvmargs=-Xmx2G
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
