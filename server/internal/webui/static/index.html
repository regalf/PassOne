<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PassOne Admin</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#2a2f3a; --text:#e6e8ee; --muted:#8b93a5; --accent:#4f8cff; --danger:#e05252; --ok:#3fb964; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  header .badge { font-size:11px; color:var(--muted); border:1px solid var(--border); padding:2px 8px; border-radius:10px; }
  main { max-width:860px; margin:24px auto; padding:0 16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 12px; font-size:14px; }
  input, button { font:inherit; }
  input[type=text], input[type=password], input[type=search] { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:6px; width:100%; }
  button { cursor:pointer; background:var(--accent); color:#fff; border:0; padding:8px 14px; border-radius:6px; }
  button.secondary { background:var(--border); }
  button.danger { background:var(--danger); }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  .status { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; }
  .status.pending { background:#5b4b00; color:#ffd75e; }
  .status.active { background:#1d4a2c; color:#7ee2a0; }
  .status.disabled { background:#4a1d1d; color:#ff8b8b; }
  .invite { background:#002244; border:1px dashed var(--accent); color:#a9ccff; padding:8px; border-radius:6px; font-family:monospace; word-break:break-all; }
  .hidden { display:none; }
  .error { color:var(--danger); }
  .ok { color:var(--ok); }
  .muted { color:var(--muted); font-size:12px; }
  #toast { position:fixed; bottom:16px; right:16px; background:var(--panel); border:1px solid var(--border); padding:10px 14px; border-radius:8px; display:none; max-width:380px; }
</style>
</head>
<body>
<header>
  <h1>PassOne <span class="badge">Admin</span></h1>
  <button class="secondary" id="logoutBtn" style="display:none">Logout</button>
</header>

<main>
  <section class="card" id="loginCard">
    <h2>Accesso admin</h2>
    <div class="row">
      <input type="password" id="tokenInput" placeholder="Admin token">
      <button id="loginBtn">Entra</button>
    </div>
    <div id="loginErr" class="error"></div>
    <p class="muted">Il token admin è nella configurazione del server o stampato al primo avvio.</p>
  </section>

  <section class="card hidden" id="createCard">
    <h2>Crea utente</h2>
    <div class="row">
      <input type="text" id="usernameInput" placeholder="Username">
      <button id="createBtn">Crea</button>
    </div>
    <div id="createResult"></div>
    <p class="muted">L'utente nasce in stato "pending": riceverà l'invite token e imposterà la propria password al primo accesso.</p>
  </section>

  <section class="card hidden" id="listCard">
    <h2>Utenti</h2>
    <div class="row">
      <input type="search" id="searchInput" placeholder="Cerca…">
    </div>
    <table>
      <thead><tr><th>ID</th><th>Username</th><th>Stato</th><th>Rev</th><th></th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
  </section>
</main>

<div id="toast"></div>

<script>
const state = { token: '' };
const $ = (id) => document.getElementById(id);

function setToken(t) { state.token = t; $('tokenInput').value = ''; $('loginCard').classList.add('hidden'); $('createCard').classList.remove('hidden'); $('listCard').classList.remove('hidden'); $('logoutBtn').style.display = ''; refresh(); }
$('loginBtn').onclick = () => { const t = $('tokenInput').value.trim(); if (!t) return; setToken(t); };
$('logoutBtn').onclick = () => { state.token = ''; $('logoutBtn').style.display = 'none'; $('createCard').classList.add('hidden'); $('listCard').classList.remove('hidden'); $('listCard').classList.add('hidden'); $('loginCard').classList.remove('hidden'); };

async function api(path, opts = {}) {
  const res = await fetch('/api/v1' + path, {
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + state.token },
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(data.error || res.status); err.code = data.code; throw err; }
  return data;
}

async function refresh() {
  const q = $('searchInput').value.toLowerCase();
  try {
    const data = await api('/admin/users');
    const rows = (data.users || []).filter(u => !q || u.username.toLowerCase().includes(q));
    $('usersBody').innerHTML = rows.map(u => `<tr>
      <td>${u.id}</td><td>${u.username}</td><td><span class="status ${u.status}">${u.status}</span></td>
      <td>${u.vault_revision}</td>
      <td>
        ${u.status === 'pending' ? `<button class="secondary" onclick="resetInvite(${u.id})">Nuovo invite</button>` : ''}
        <button class="danger" onclick="delUser(${u.id})">Elimina</button>
      </td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nessun utente.</td></tr>';
  } catch (e) { toast('Errore: ' + e.message, true); }
}
$('searchInput').oninput = refresh;

$('createBtn').onclick = async () => {
  const username = $('usernameInput').value.trim();
  if (!username) return;
  try {
    const data = await api('/admin/users', { method: 'POST', body: JSON.stringify({ username }) });
    $('createResult').innerHTML = `<p class="ok">Utente "${data.user.username}" creato.</p>
      <div class="invite">${data.invite_token}</div>
      <p class="muted">Invite token monouso — consegnalo all'utente.</p>`;
    $('usernameInput').value = '';
    refresh();
  } catch (e) { $('createResult').innerHTML = `<p class="error">${e.message}</p>`; }
};

async function resetInvite(id) {
  try {
    const data = await api('/admin/users/' + id + '/reset-invite', { method: 'POST' });
    $('createResult').innerHTML = `<div class="invite">${data.invite_token}</div><p class="muted">Nuovo invite token.</p>`;
  } catch (e) { toast(e.message, true); }
}

async function delUser(id) {
  if (!confirm('Eliminare definitivamente questo utente?')) return;
  try {
    await api('/admin/users/' + id, { method: 'DELETE' });
    refresh();
  } catch (e) { toast(e.message, true); }
}

let toastTimer;
function toast(msg, isErr) {
  $('toast').textContent = msg;
  $('toast').style.borderColor = isErr ? 'var(--danger)' : 'var(--border)';
  $('toast').style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').style.display = 'none', 4000);
}
</script>
</body>
</html>
